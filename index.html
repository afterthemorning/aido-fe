<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="shortcut icon" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      .preloader {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        flex-direction: column;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        animation: preloader-fade-in 0.6s ease-out 0.3s forwards;
      }

      .preloader__logo {
        width: 56px;
        height: 56px;
        background-repeat: no-repeat;
        background-size: contain;
        background-image: url('/image/logo-aido.svg');
        margin-bottom: 16px;
      }

      .preloader__text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        color: #888;
        letter-spacing: 0.3em;
      }

      @keyframes preloader-fade-in {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
    </style>
    <script src="/js/node-sql-parser@4.10.0_umd_mysql.umd.js"></script>
    <script src="/js/placement.min.js"></script>
  </head>

  <body>
    <div class="preloader" aria-live="polite" role="status" aria-label="Loading AIDO">
      <div class="preloader__logo"></div>
      <div class="preloader__text">Welcome to use AIDO</div>
    </div>
    <div id="root"></div>
    <div id="hoc-renderer-root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      // 根据环境变量决定是否加载 Headway widget
      if (!import.meta.env.VITE_IS_PRO && !import.meta.env.VITE_IS_PRO) {
        // 动态加载 Headway widget 脚本
        const script = document.createElement('script');
        script.src = '/js/widget.js';
        document.head.appendChild(script);
      }
    </script>
  </body>
</html>
